name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # The integration tests create and drop their own database on this server.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crypton
          POSTGRES_PASSWORD: crypton
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crypton"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CRYPTON_TEST_POSTGRES: Host=localhost;Port=5432;Username=crypton;Password=crypton;Database=postgres
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore Crypton.slnx

      - run: dotnet build Crypton.slnx --configuration Release --no-restore

      - run: dotnet test Crypton.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Check for missing migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Crypton.Core --startup-project src/Crypton.Api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: crypton-api:ci
